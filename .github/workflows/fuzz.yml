name: Fuzz campaign

# The engine against the brute-force reference solver on generated games.
# Too slow for every push, so weekly and on demand.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      games:
        description: Games per job and check
        default: '1500'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Run the campaign
        run: STRICT=1 GAMES=${{ inputs.games || '1500' }} bash scripts/fuzz-campaign.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-failures
          path: fuzz-runs/campaign/
          retention-days: 14
