name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck, test, build, accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: |
          npm run typecheck:test
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.worker.json
          npx tsc --noEmit -p tsconfig.component.json
      - name: Unit tests (includes engine vs reference solver checks)
        run: npm test
      - name: Component tests (Angular, jsdom)
        run: npm run test:components
      - name: Build
        run: npm run build
      - name: Install Chromium for the accessibility checks
        run: npx playwright install --with-deps chromium
      - name: Accessibility (axe, WCAG 2.2 AA)
        run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
